     role="img" aria-labelledby="title description">
  <title id="title">Cell ice-cream icon — original orientation</title>
  <desc id="description">A pink cell in the original orientation above a blue scoop and a golden waffle cone. All artwork consists of editable vector shapes, with no embedded raster images. The background and the spaces between the scoops and cone are transparent.</desc>
  <defs>
    <linearGradient id="cell-membrane-color" x1="165" y1="14" x2="196" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dd5b6c"/>
      <stop offset="1" stop-color="#d85266"/>
    </linearGradient>
    <linearGradient id="cell-interior-color" x1="165" y1="23" x2="204" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f39ca4"/>
      <stop offset="1" stop-color="#ef969f"/>
    </linearGradient>
    <linearGradient id="nucleus-color" x1="164" y1="89" x2="203" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e6d2"/>
      <stop offset="1" stop-color="#f4dec9"/>
    </linearGradient>
    <linearGradient id="blue-scoop-color" x1="119" y1="169" x2="270" y2="162" gradientUnits="userSpaceOnUse">
